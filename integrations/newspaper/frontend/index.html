<style>
#paper-comprehensive { --page:#f7f3e9; --ink:#292821; --muted-ink:#716a5b; --rule:#cdc4b3; --wash:#ebe4d5; --red:#993e2b; --green:#496442; --white:#fffdf8; background:var(--page); color:var(--ink); padding:16px 24px 20px; font:14px/1.65 'Microsoft YaHei','PingFang SC',sans-serif; min-height:740px; }

#paper-comprehensive .mast { display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:15px; padding:13px 0; border-bottom:4px double var(--ink); }
#paper-comprehensive .mast h1 { font:400 clamp(48px,6.4vw,82px)/1.2 'Rye',Georgia,'Times New Roman',serif; letter-spacing:0; margin:0 0 4px; text-align:center; }
#paper-comprehensive .mast .motto { font-size:11px; letter-spacing:4px; text-align:center; }
#paper-comprehensive .mast .edition { font-size:12px; }
#paper-comprehensive .mast .reading-return { text-align:right; }
#paper-comprehensive .main-nav { display:flex; gap:4px; align-items:center; flex-wrap:wrap; padding:9px 0; border-bottom:1px solid var(--ink); }

#paper-comprehensive .section-label { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--muted-ink); padding:7px 0 10px; }

#paper-comprehensive .item-meta { color:var(--muted-ink); font-size:11px; margin-top:3px; }
#paper-comprehensive .item-meta .kind { color:var(--red); margin-right:5px; }
#paper-comprehensive .news-summary { font-size:12px; color:var(--muted-ink); margin:4px 0; }

#paper-comprehensive .group { border-top:2px solid var(--ink); padding:9px 0; }
#paper-comprehensive .group h3 { margin:0 0 8px; font:500 19px/1.5 'STSong','SimSun',serif; }

#paper-comprehensive .filter-row button { font-size:12px; }

#paper-comprehensive .reader-source { background:var(--wash); padding:10px 14px; margin:18px 0; font-size:12px; }

#paper-comprehensive .collection-toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:9px 0; }

#paper-comprehensive .empty { text-align:center; color:var(--muted-ink); padding:50px 12px; }
#paper-comprehensive .bookshelf { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; padding:13px 0; }

#paper-comprehensive .work h3 { font:500 21px/1.5 'STSong','SimSun',serif; margin:12px 0; }
#paper-comprehensive .work p { color:var(--muted-ink); font-size:13px; margin:6px 0; }
#paper-comprehensive .work .work-actions { display:flex; gap:6px; flex-wrap:wrap; margin-top:13px; }
#paper-comprehensive .topic-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; margin-top:15px; }
#paper-comprehensive .topic { border-top:2px solid var(--ink); padding:12px 0; }
#paper-comprehensive .topic h3 { font:500 22px/1.5 'STSong','SimSun',serif; margin:4px 0; }
#paper-comprehensive .timeline { padding:10px 0; }

#paper-comprehensive .source-table th { color:var(--muted-ink); font-size:12px; }

#paper-comprehensive .footer { border-top:4px double var(--rule); margin-top:22px; padding-top:9px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; font-size:11px; color:var(--muted-ink); }
@media(max-width:740px) { #paper-comprehensive {padding:14px;} #paper-comprehensive .sections,#paper-comprehensive .bookshelf {grid-template-columns:repeat(2,minmax(0,1fr));} #paper-comprehensive .mast {grid-template-columns:auto 1fr;} #paper-comprehensive .mast .edition {display:none;} #paper-comprehensive .mast h1 {font-size:40px;} }
@media(max-width:450px) { #paper-comprehensive .sections,#paper-comprehensive .bookshelf,#paper-comprehensive .groups,#paper-comprehensive .topic-grid {grid-template-columns:1fr;} #paper-comprehensive .saved-row {grid-template-columns:1fr;} #paper-comprehensive .saved-row .row-controls {justify-content:flex-start;} #paper-comprehensive .reader-body h1 {font-size:26px;} #paper-comprehensive .timeline-item {grid-template-columns:65px minmax(0,1fr);} }

#paper-comprehensive { box-sizing:border-box; width:100%; max-width:1500px; margin:0 auto; overflow-wrap:anywhere; }

#paper-comprehensive .session-notice { border-left-color:var(--red); }

@media(max-width:740px) {

<script>
(() => {
 const root=document.getElementById("paper-comprehensive");

 ];

 const SYNC_KEY='newspaper-reader-sync-v1';

  const now=performance.now();if(readingClock.last)readingClock.elapsed+=Math.min(1500,Math.max(0,now-readingClock.last));readingClock.last=now;
