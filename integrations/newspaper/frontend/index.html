<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Newspaper · 综合新闻</title>
<style>
html,body { margin:0; padding:0; width:100%; min-width:0; background:#f7f3e9; color:#292821; color-scheme:light; }
body { overflow-x:hidden; }
button { cursor:pointer; }
button:disabled { cursor:not-allowed; }

<body>
<style>
#paper-comprehensive { --page:#f7f3e9; --ink:#292821; --muted-ink:#716a5b; --rule:#cdc4b3; --wash:#ebe4d5; --red:#993e2b; --green:#496442; --white:#fffdf8; background:var(--page); color:var(--ink); padding:16px 24px 20px; font:14px/1.65 'Microsoft YaHei','PingFang SC',sans-serif; min-height:740px; }
#paper-comprehensive * { box-sizing:border-box; }
#paper-comprehensive button,#paper-comprehensive input,#paper-comprehensive select,#paper-comprehensive textarea { font:inherit; color:var(--ink); background:var(--white); border:1px solid var(--rule); border-radius:3px; padding:5px 9px; max-width:100%; }
#paper-comprehensive button:hover { background:var(--wash); }
#paper-comprehensive button:focus-visible { outline:2px solid var(--red); outline-offset:2px; }
#paper-comprehensive button[aria-pressed=true] { background:var(--ink); color:var(--page); border-color:var(--ink); }
#paper-comprehensive button:disabled { opacity:.55; }
#paper-comprehensive .bare { border:0; background:none; padding:2px 0; text-align:left; }
#paper-comprehensive .fine { font-size:12px; color:var(--muted-ink); }
#paper-comprehensive .accent { color:var(--red); }
#paper-comprehensive .good { color:var(--green); }
#paper-comprehensive .shell { display:flex; justify-content:space-between; gap:12px;  flex-wrap:wrap; font-size:12px; color:var(--muted-ink); }
#paper-comprehensive .mast { display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:15px; padding:13px 0; border-bottom:4px double var(--ink); }
#paper-comprehensive .mast h1 { font:700 clamp(33px,5.3vw,59px)/1.05 Georgia,'Times New Roman',serif; letter-spacing:-2px; margin:0 0 8px; text-align:center; }
#paper-comprehensive .mast .motto { font-size:11px; letter-spacing:4px; text-align:center; }
#paper-comprehensive .mast .edition { font-size:12px; }
#paper-comprehensive .mast .reading-return { text-align:right; }
#paper-comprehensive .main-nav { display:flex; gap:4px; align-items:center; flex-wrap:wrap; padding:9px 0; border-bottom:1px solid var(--ink); }
#paper-comprehensive .main-nav button { border:0; background:none; padding:5px 10px; }
#paper-comprehensive .main-nav button[aria-pressed=true] { background:var(--ink); color:var(--page); }
#paper-comprehensive .grow { flex:1; }
#paper-comprehensive .search-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:10px 0; }
#paper-comprehensive .search-row input { flex:1; min-width:120px; }
#paper-comprehensive .notice:empty { display:none; }
#paper-comprehensive .notice { border-left:3px solid var(--red); background:var(--wash); padding:7px 12px; margin:10px 0; font-size:12px; }
#paper-comprehensive .section-label { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--muted-ink); padding:7px 0 10px; }
#paper-comprehensive .sections { display:grid; grid-template-columns:repeat(var(--paper-columns,3),minmax(0,1fr)); gap:18px; }
#paper-comprehensive .paper-section { min-width:0; border-bottom:1px solid var(--rule); padding-bottom:8px; }
#paper-comprehensive .paper-section h2 { font:500 19px/1.5 'STSong','SimSun',serif; margin:0 0 4px; border-top:2px solid var(--ink); padding:8px 0 0; display:flex; justify-content:space-between; align-items:center; gap:10px; }
#paper-comprehensive .paper-section h2 button { font:12px/1.5 'Microsoft YaHei',sans-serif; color:var(--muted-ink); }
#paper-comprehensive .news-item { border-bottom:1px dotted var(--rule); padding:7px 0; }
#paper-comprehensive .news-item:last-child { border:0; }
#paper-comprehensive .news-title { font:500 var(--title-size,17px)/1.5 'STSong','SimSun',serif; width:100%; display:block; }
#paper-comprehensive .item-meta { color:var(--muted-ink); font-size:11px; margin-top:3px; }
#paper-comprehensive .item-meta .kind { color:var(--red); margin-right:5px; }
#paper-comprehensive .news-summary { font-size:12px; color:var(--muted-ink); margin:4px 0; }
#paper-comprehensive .item-actions { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:3px; }
#paper-comprehensive .item-actions button { font-size:11px; color:var(--muted-ink); }
#paper-comprehensive .topic-strip { display:flex; align-items:center; flex-wrap:wrap; gap:8px; padding:9px 0; margin-bottom:13px; border-bottom:3px double var(--rule); }
#paper-comprehensive .topic-strip span { color:var(--red); font-size:12px; }
#paper-comprehensive .topic-strip button { font-size:12px; border:0; background:none; }
#paper-comprehensive .page-title { font:500 28px/1.5 'STSong','SimSun',serif; margin:18px 0 5px; }
#paper-comprehensive .groups { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px; margin-top:14px; }
#paper-comprehensive .group { border-top:2px solid var(--ink); padding:9px 0; }
#paper-comprehensive .group h3 { margin:0 0 8px; font:500 19px/1.5 'STSong','SimSun',serif; }
#paper-comprehensive .group .category-row { display:flex; align-items:center; justify-content:space-between; gap:6px; border-bottom:1px dotted var(--rule); padding:5px 0; }
#paper-comprehensive .group .category-row button { font-size:13px; }
#paper-comprehensive .group .category-row .pin { color:var(--muted-ink); font-size:11px; }
#paper-comprehensive .filter-row { display:flex; flex-wrap:wrap; gap:6px; margin:12px 0; }
#paper-comprehensive .filter-row button { font-size:12px; }
#paper-comprehensive .article-list .news-item { padding:12px 0; }
#paper-comprehensive .article-list .news-title { font-size:20px; }
#paper-comprehensive .reader-bar { display:flex; align-items:center; flex-wrap:wrap; gap:8px; padding:14px 0; border-bottom:1px solid var(--rule); }
#paper-comprehensive .reader-body { max-width:700px; margin:25px auto; }
#paper-comprehensive .reader-body.wide { max-width:none; }
#paper-comprehensive .reader-body h1 { font:500 31px/1.5 'STSong','SimSun',serif; margin:9px 0 12px; }
#paper-comprehensive .reader-body p.read-text { font:400 var(--read-size,18px)/1.95 'STSong','SimSun',serif; text-indent:2em; margin:18px 0; }
#paper-comprehensive .reader-source { background:var(--wash); padding:10px 14px; margin:18px 0; font-size:12px; }
#paper-comprehensive .reading-actions { display:flex; flex-wrap:wrap; gap:6px; padding:12px 0; border-top:1px solid var(--rule); }
#paper-comprehensive .reader-notes { background:var(--white); border:1px solid var(--rule); padding:14px; margin-top:12px; }
#paper-comprehensive .reader-notes textarea { width:100%; min-height:75px; margin:8px 0; resize:vertical; }
#paper-comprehensive .reader-notes .note-fields { display:flex; gap:10px; flex-wrap:wrap; }
#paper-comprehensive .reader-notes label { flex:1; min-width:130px; }
#paper-comprehensive .reader-notes input,#paper-comprehensive .reader-notes select { width:100%; margin-top:4px; }
#paper-comprehensive .reader-notes h3 { margin:0; font-weight:500; }
#paper-comprehensive .collection-toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:9px 0; }
#paper-comprehensive .saved-row { border-top:1px solid var(--rule); padding:12px 0; display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:start; gap:12px; }
#paper-comprehensive .saved-row .state-tags { color:var(--red); font-size:12px; margin:3px 0; }
#paper-comprehensive .saved-row .row-controls { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
#paper-comprehensive .saved-row .row-controls button { font-size:12px; }
#paper-comprehensive .empty { text-align:center; color:var(--muted-ink); padding:50px 12px; }
#paper-comprehensive .bookshelf { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; padding:13px 0; }
#paper-comprehensive .work { background:var(--white); border:1px solid var(--rule); padding:15px; }
#paper-comprehensive .work .work-type { color:var(--red); font-size:12px; }
#paper-comprehensive .work h3 { font:500 21px/1.5 'STSong','SimSun',serif; margin:12px 0; }
#paper-comprehensive .work p { color:var(--muted-ink); font-size:13px; margin:6px 0; }
#paper-comprehensive .work .work-actions { display:flex; gap:6px; flex-wrap:wrap; margin-top:13px; }
#paper-comprehensive .topic-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; margin-top:15px; }
#paper-comprehensive .topic { border-top:2px solid var(--ink); padding:12px 0; }
#paper-comprehensive .topic h3 { font:500 22px/1.5 'STSong','SimSun',serif; margin:4px 0; }
#paper-comprehensive .timeline { padding:10px 0; }
#paper-comprehensive .timeline-item { display:grid; grid-template-columns:90px minmax(0,1fr); gap:14px; padding:10px 0; border-bottom:1px solid var(--rule); }
#paper-comprehensive .timeline-item .when { color:var(--red); font-size:12px; }
#paper-comprehensive .source-table { width:100%; border-collapse:collapse; margin-top:12px; }
#paper-comprehensive .source-table th,#paper-comprehensive .source-table td { border-bottom:1px solid var(--rule); padding:10px 6px; text-align:left; font-weight:400; }
#paper-comprehensive .source-table th { color:var(--muted-ink); font-size:12px; }
#paper-comprehensive .setting-group { border-top:1px solid var(--rule); padding:17px 0; }
#paper-comprehensive .setting-group h3 { font:500 20px/1.5 'STSong','SimSun',serif; margin:0 0 10px; }
#paper-comprehensive .footer { border-top:4px double var(--rule); margin-top:22px; padding-top:9px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; font-size:11px; color:var(--muted-ink); }
@media(max-width:740px) { #paper-comprehensive {padding:14px;} #paper-comprehensive .sections,#paper-comprehensive .bookshelf {grid-template-columns:repeat(2,minmax(0,1fr));} #paper-comprehensive .mast {grid-template-columns:auto 1fr;} #paper-comprehensive .mast .edition {display:none;} #paper-comprehensive .mast h1 {font-size:40px;} }
@media(max-width:450px) { #paper-comprehensive .sections,#paper-comprehensive .bookshelf,#paper-comprehensive .groups,#paper-comprehensive .topic-grid {grid-template-columns:1fr;} #paper-comprehensive .saved-row {grid-template-columns:1fr;} #paper-comprehensive .saved-row .row-controls {justify-content:flex-start;} #paper-comprehensive .reader-body h1 {font-size:26px;} #paper-comprehensive .timeline-item {grid-template-columns:65px minmax(0,1fr);} }
@media(pointer:coarse) { #paper-comprehensive button {min-height:42px;} #paper-comprehensive input,#paper-comprehensive select,#paper-comprehensive textarea {font-size:16px;} }

#paper-comprehensive { box-sizing:border-box; width:100%; max-width:1500px; margin:0 auto; overflow-wrap:anywhere; }
#paper-comprehensive .mast > * { min-width:0; }
#paper-comprehensive .mast .motto { letter-spacing:2px; }
#paper-comprehensive .reader-body h1 { outline:none; }
#paper-comprehensive .settings-fields { display:flex; flex-wrap:wrap; gap:14px; }
#paper-comprehensive .settings-fields label { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
#paper-comprehensive .source-table { table-layout:fixed; }
#paper-comprehensive .source-table td { overflow-wrap:anywhere; font-size:12px; }
#paper-comprehensive .session-notice { border-left-color:var(--red); }
#paper-comprehensive:fullscreen { max-width:none; min-height:0; height:100dvh; overflow:auto; padding:18px max(18px,calc((100vw - 1080px)/2)); }
#paper-comprehensive:fullscreen .reader-bar { position:sticky; top:-18px; z-index:2; background:var(--page); }
@media(max-width:740px) {
 #paper-comprehensive .mast { grid-template-columns:minmax(0,1fr); gap:8px; }
 #paper-comprehensive .mast h1 { font-size:clamp(38px,10vw,58px); letter-spacing:-1.5px; }
 #paper-comprehensive .mast .reading-return { display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap; text-align:center; }
 #paper-comprehensive .mast .motto { font-size:10px; letter-spacing:2px; }
 #paper-comprehensive .main-nav { gap:2px; }
 #paper-comprehensive .main-nav button { padding:5px 8px; }
}
@media(max-width:350px) {
 #paper-comprehensive { padding:12px; }
 #paper-comprehensive .mast h1 { font-size:36px; }
 #paper-comprehensive .mast .motto { letter-spacing:1px; }
 #paper-comprehensive .source-table th,#paper-comprehensive .source-table td { padding:8px 3px; }
}

#paper-comprehensive a { color:var(--red); text-decoration:none; }
#paper-comprehensive a:hover { text-decoration:underline; }
#paper-comprehensive .source-link { display:inline-block; padding:5px 9px; border:1px solid var(--rule); border-radius:3px; background:var(--white); font-size:13px; }
#paper-comprehensive .reader-bar .source-link { color:var(--ink); }
#paper-comprehensive .loading { padding:36px 12px; text-align:center; color:var(--muted-ink); }
#paper-comprehensive .source-table td small { display:block; font-size:11px; color:var(--muted-ink); }
#paper-comprehensive .reader-empty { padding:18px 0; color:var(--muted-ink); }
#paper-comprehensive .source-table .error-text { color:var(--red); }

#paper-comprehensive .ai-news-grid { display:grid; grid-template-columns:repeat(var(--paper-columns,3),minmax(0,1fr)); gap:8px 20px; }
#paper-comprehensive .ai-news-grid .news-item { min-width:0; border-top:1px solid var(--rule); border-bottom:0; padding:12px 0; }
#paper-comprehensive .ai-news-grid .news-summary { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:4; overflow:hidden; }
#paper-comprehensive .ai-meta { display:flex; gap:5px 10px; flex-wrap:wrap; margin-top:4px; font-size:11px; color:var(--muted-ink); }
#paper-comprehensive .ai-provenance { color:var(--red); }
#paper-comprehensive .ai-links { display:flex; flex-wrap:wrap; gap:12px; margin:5px 0; font-size:11px; }
#paper-comprehensive .ai-links a { color:var(--muted-ink); }
#paper-comprehensive .ai-controls { display:flex; justify-content:space-between; gap:8px 20px; flex-wrap:wrap; align-items:center; }
#paper-comprehensive .ai-controls .filter-row { margin:8px 0; }
#paper-comprehensive .ai-context { border-top:2px solid var(--ink); padding:12px 0 5px; margin-top:14px; }
#paper-comprehensive .ai-context p { margin:4px 0 8px; font-size:12px; color:var(--muted-ink); }
#paper-comprehensive .ai-summary-label { color:var(--red); font-size:12px; margin-right:5px; }
@media(max-width:740px) { #paper-comprehensive .ai-news-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media(max-width:450px) { #paper-comprehensive .ai-news-grid { grid-template-columns:1fr; } }

#paper-comprehensive .recommend-grid { display:grid; grid-template-columns:repeat(var(--paper-columns,3),minmax(0,1fr)); gap:10px 20px; }
#paper-comprehensive .recommendation-item { min-width:0; border-top:1px solid var(--rule); border-bottom:0; }
#paper-comprehensive .recommendation-item .news-summary { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; overflow:hidden; }
#paper-comprehensive .recommend-preview { border-top:2px solid var(--ink); border-bottom:3px double var(--rule); margin:0 0 18px; padding-bottom:10px; }
#paper-comprehensive .recommend-meta { display:flex; flex-wrap:wrap; gap:8px; color:var(--muted-ink); font-size:11px; }
#paper-comprehensive .recommend-lane { color:var(--red); }
#paper-comprehensive .recommend-reason { color:var(--green); font-size:11px; margin-top:4px; }
#paper-comprehensive .recommend-toolbar { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:8px; }
#paper-comprehensive .recommend-summary { background:var(--wash); padding:8px 12px; font-size:12px; margin:8px 0; }
#paper-comprehensive .recommend-summary details { margin-top:5px; color:var(--muted-ink); }
#paper-comprehensive .recommend-summary summary { cursor:pointer; }
#paper-comprehensive .recommend-summary p { margin:6px 0; }
@media(max-width:740px) { #paper-comprehensive .recommend-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media(max-width:450px) { #paper-comprehensive .recommend-grid { grid-template-columns:1fr; } }
</style>
<div id="paper-comprehensive" aria-label="Newspaper 综合新闻" tabindex="-1"></div>
<script src="./recommendation.js"></script>
<script>
(() => {
 const root=document.getElementById("paper-comprehensive");
 const catalog=[
 ['时政与国防',['时政要闻','政策解读','公共治理','法治司法','港澳台','国防军事']],
 ['全球视野',['国际要闻','大国关系','区域观察','冲突与安全','国际组织','全球议题']],
 ['经济与产业',['宏观经济','产业制造','公司商业','消费零售','能源资源','三农乡村']],
 ['金融与市场',['A股市场','港股与海外市场','银行保险','基金理财','债券汇率与大宗','房产楼市']],
 ['科技与科学',['AI与互联网','芯片与通信','数码产品','科学前沿','航天航空','汽车与交通技术']],
 ['社会与民生',['地方城市','教育校园','就业职场','医疗健康','社保养老','消费维权']],
 ['生活与人文',['旅行地理','美食与饮食','居家生活','历史文博','艺术展览','环境自然']],
 ['体育与运动',['足球','篮球','乒羽网球','综合竞技','电竞','全民健身与户外']],
 ['阅读与文学',['小说推荐','网络文学','散文随笔','诗歌','文学评论','新书与综合书单']],
 ['电影与电视',['电影资讯与片单','电视剧与网剧','纪录片','动画动漫','综艺音乐','影评与主创访谈']]
 ];

 const categories=catalog.flatMap(group=>group[1]);
 const groupsByCategory=new Map(catalog.flatMap(([group,cats])=>cats.map(category=>[category,group])));
 const defaultPins=['时政要闻','国际要闻','国防军事','宏观经济','A股市场','AI与互联网','地方城市','教育校园','足球','小说推荐','电影资讯与片单','电视剧与网剧'];
 const folders=['未分类','工作资料','长读收藏','书影资料'];
 const marks=['待读','重要','待核实'];
 const topics=catalog.map(([name,cats],i)=>({id:`group-${i}`,name,categories:cats}));
 const AIHOT_HOME='https://aihot.news/';
 const AI_SECTIONS=[['paper','研究论文'],['industry','行业动态'],['ai-models','模型进展'],['ai-products','产品应用'],['tip','教程与观点']];
 const STORE_KEY='newspaper-local-library-v1';
 const RECOMMEND_KEY='newspaper-local-recommendation-v1';
 const recommendationEngine=window.NewspaperRecommendation||null;
 const state={screen:'front',category:'',type:'全部',query:'',filter:'全部',folder:'全部',current:null,returnTo:null,readerWide:false,notesOpen:false,topic:'group-0',artGroup:'全部',aiSource:'全部',aiCategory:'全部',notice:'',undo:null};
 const defaults=()=>({version:1,revision:'',records:{},pins:[...defaultPins],pinsCustomized:false,following:[],lastRead:null,lastArticle:null,design:{columns:3,title:17,read:18}});
 let data=defaults(),articles=[],articleIndex=new Map(),sources=[];
 let recommendationPreferences=null,recommendationBatch=null,recommendationDirty=false,recommendationWarning='',recommendationSeed=0,feedVersion='';
 let readingClock={id:null,elapsed:0,last:0,counted:false},readerInView=true;
 let receivedFeed=false,fetchedAt=null,attemptedAt=null,stale=false,feedErrors=[];
 let storageWarning='',storageBroken=false,componentDisabled=false,frameQueued=false,lastFrameHeight=0,fullscreenExitAt=0,pendingRefresh=null,firstFeedTimer=null,sequence=0;
 const details=new Map(),pendingReads=new Map(),drafts=Object.create(null);
 const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const clone=value=>JSON.parse(JSON.stringify(value));
 const text=value=>typeof value==='string'?value.trim():'';
 const validId=value=>typeof value==='string'&&/^[A-Za-z0-9][A-Za-z0-9._:-]{0,179}$/.test(value);
 const nonce=()=>globalThis.crypto?.randomUUID?.()||`${Date.now()}-${++sequence}-${Math.random().toString(36).slice(2)}`;
 function safeUrl(value){try{const url=new URL(String(value));return ['http:','https:'].includes(url.protocol)&&!url.username&&!url.password?url.href:'';}catch{return '';}}
 function validDate(value){const v=text(value);return v&&Number.isFinite(Date.parse(v))?v:null;}
 function dateLabel(value,unknown='发布时间未知',precision='minute'){
  if(!validDate(value))return unknown;
  return new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',...(precision==='day'?{}:{hour:'2-digit',minute:'2-digit',hour12:false}),timeZone:'Asia/Shanghai'}).format(new Date(value));
 }
 function boundedMetadata(value,depth=0){
  if(depth>3)return null;
  if(typeof value==='string')return value.slice(0,2000);
  if(value===null||typeof value==='boolean')return value;
  if(typeof value==='number')return Number.isFinite(value)?value:null;
  if(Array.isArray(value))return value.slice(0,20).map(item=>boundedMetadata(item,depth+1));
  if(value&&typeof value==='object')return Object.fromEntries(Object.entries(value).slice(0,20).filter(([key])=>!['__proto__','prototype','constructor'].includes(key)).map(([key,item])=>[key.slice(0,80),boundedMetadata(item,depth+1)]));
  return null;
 }
 function normalizeArticle(raw){
  if(!raw||!validId(raw.id)||!text(raw.title))return null;
  const category=text(raw.category)||'未分类';
