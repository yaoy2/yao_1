<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'">
  <title>随手传 · 办公电脑 L</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
<main>
  <div class="topline"><strong>办公电脑 L <span class="badge">原文件传输</span></strong><span id="connection" role="status">正在准备</span></div>
  <p id="message" class="message" aria-live="polite">首次绑定后，记住发送目标与保存位置。</p>
  <section id="welcome" hidden>
    <div class="actions"><button id="setup">设为办公电脑 L</button><button id="enter-code" class="secondary">手机输入绑定信息</button></div>
    <p class="hint">仅在 L 上设置接收。手机扫描 L 的二维码即可绑定。</p>
  </section>
  <section id="receiver" hidden>
    <div class="actions"><button id="resume" hidden>恢复文件夹授权</button><button id="pair" class="secondary">绑定手机</button><button id="folder" class="secondary">更换保存文件夹</button><a id="standalone" class="button secondary" target="_blank" rel="noopener">独立接收窗口 ↗</a></div>
    <p id="destination" class="hint"></p>
    <p class="hint">保持此页打开。另开标签页使用其他模块，接收可继续。</p>
  </section>
  <section id="sender" hidden>
    <div class="actions"><button id="pick" disabled>选择原文件</button><button id="send" hidden>发送到办公电脑 L</button></div>
    <input id="files" type="file" multiple hidden>
    <p class="hint">每个文件最多 200 MiB。iPhone 请从“文件”选取原件；相册原件可先“导出未修改的原片”。发送完成前保持页面打开。</p>
    <ul id="selection" class="files"></ul>
  </section>
  <section id="pairing" class="panel" hidden>
    <div class="pair-layout"><canvas id="qr" aria-label="手机绑定二维码"></canvas><div><strong>用手机相机扫码绑定</strong><p class="hint">绑定信息仅交给自己的手机。之后在手机收藏本页。</p><button id="copy" class="secondary">复制绑定链接</button><button id="close-pair" class="quiet">收起</button></div></div>
  </section>
  <section id="join" class="panel" hidden>
    <label for="token">粘贴办公电脑 L 的绑定链接</label><textarea id="token" rows="3" autocomplete="off" spellcheck="false"></textarea>
    <div class="actions"><button id="bind">绑定办公电脑 L</button><button id="cancel-join" class="secondary">取消</button></div>
  </section>
  <section id="progress-box" hidden><div class="progress-label"><span id="progress-text"></span><span id="percentage"></span></div><progress id="progress" max="1" value="0"></progress></section>
  <section id="history-box" hidden><h2>本次已保存</h2><ul id="history" class="files"></ul></section>
  <footer><span>不压缩 · 按日期保存 · 不覆盖同名文件</span><button id="reset" class="quiet" hidden>解除此浏览器绑定</button></footer>
</main>
</body>
</html>
