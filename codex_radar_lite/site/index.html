<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex Radar Lite</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div>
        <p class="eyebrow">Codex Radar Lite</p>
        <h1>Codex 重置窗口监控</h1>
        <p class="summary" id="reason">正在读取状态...</p>
      </div>
      <div class="status-card">
        <span class="status-label" id="status">loading</span>
        <div class="prob-row">
          <div>
            <strong id="p24">--%</strong>
            <span>24小时</span>
          </div>
          <div>
            <strong id="p48">--%</strong>
            <span>48小时</span>
          </div>
        </div>
        <p id="checked">最近检查：--</p>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>关键证据</h2>
        <a href="../../data/codex_radar_feed.xml">RSS</a>
      </div>
      <div id="signals" class="signal-list"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
