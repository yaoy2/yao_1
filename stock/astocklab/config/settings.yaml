data:
  history_start: "2021-01-01"
  benchmark_history_start: "2010-01-01"
  raw_snapshot_retention_days: 30

features:
  ma_periods: [5, 10, 20, 60]
  return_periods: [1, 3, 5, 10, 20]
  atr_period: 14
  percentile_window: 120
  thresholds:
    trend:
      strong_ma20_distance: 0.05
      ma20_distance: 0.01
    volume:
      high_ratio: 1.5
      low_ratio: 0.7
    location:
      near_high: 0.8
      near_low: 0.2
    relative_strength:
      strong_20d: 0.03
      weak_20d: -0.03
  market_linkage:
    correlation_windows: [20, 60]
    return_periods: [1, 5, 20, 60]
    strong_excess_20d: 0.03
  money_flow:
    large_trade_quantile: 0.95
    strong_net_ratio: 0.15
    net_ratio: 0.05
    tail_start: "14:30:00"
    high_confidence_coverage: 0.995
    medium_confidence_coverage: 0.98

prediction:
  enabled: true
  show_in_ui_default: false
  engine: "historical_joint_analog_v1"
  horizon_days: 5
  lookback_days: 20
  analog_count: 50
  min_analog_count: 30
  validation_origins: 100
  calibration_neighbor_count: 60
  interval_coverage: 0.80
  sideways_threshold: 0.01
  min_market_improvement: 0.01
  force_market_conditioning: false
  research_pool:
    minimum_listing_history_days: 120
    minimum_ranking_history_days: 260
    minimum_backtest_history_days: 500
    recent_amount_window: 20
    minimum_recent_amount_days: 15
    minimum_average_amount: 50000000
    minimum_valid_ohlc_ratio: 0.995
    max_stale_trading_days: 0
    target_pool_size: 300
    excluded_name_tokens: ["ST", "退"]

paths:
  database: "data/database/astock.duckdb"
  raw_daily: "data/raw/daily"
  raw_benchmark: "data/raw/benchmark"
  raw_tick: "data/raw/tick"
  raw_minute: "data/raw/minute"
  ths_imports: "data/imports/ths"
  reports_daily: "reports/daily"
  context_pack: "reports/context_pack"
  predictions: "reports/predictions"
  research_pool_reports: "reports/research_pool"
  logs: "logs"
