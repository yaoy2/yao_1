name: Codex Radar Lite

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      demo_alert:
        description: "Send a DingTalk demo alert instead of running the radar"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.demo_alert == 'true') }}
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Send DingTalk demo alert
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.demo_alert == 'true' }}
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: python -m codex_radar_lite.demo_alert

      - name: Run radar
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.demo_alert == 'true') }}
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: python -m codex_radar_lite.cli

      - name: Commit radar data
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.demo_alert == 'true') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/codex_radar_current.json data/codex_radar_history.json data/codex_radar_signals.json data/codex_radar_feed.xml
          if git diff --cached --quiet; then
            echo "No radar data changes to commit."
            exit 0
          fi
          git commit -m "chore: update codex radar data"
          git pull --rebase origin main
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push failed on attempt ${attempt}; syncing latest main before retry."
            git pull --rebase origin main
          done
          git push
